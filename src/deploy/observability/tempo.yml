# Tempo is the trace store behind Grafana. It ships no UI of its own, which is the reason it was
# chosen: Grafana stays the single pane and correlates traces with the Loki logs already here.
# Alloy owns the OTLP ingress, so this file receives only from Alloy over the Compose network.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Small blocks keep a just-finished request queryable in seconds rather than minutes, which is
  # the whole point of opening a trace while the query is still in view.
  max_block_duration: 5m

compactor:
  compaction:
    # Traces are diagnostic and expire. The durable record of what work was done stays in the
    # `usage_event` ledger in PostgreSQL, which no retention window ever touches.
    block_retention: ${AIZK_TEMPO_RETENTION:-336h}

# The metrics generator is what turns spans into the dashboard without a single hand-rolled
# counter. `span-metrics` derives RED series per operation and peer, `service-graphs` derives the
# call graph between aizk and everything it dials, and `local-blocks` is what lets TraceQL metrics
# queries aggregate raw span attributes, which is how per-user token spend is summed.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://victoriametrics:8428/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    span_metrics:
      # Every dimension here becomes a label on `traces_spanmetrics_*`. `server.address` is what
      # the httpx instrumentation already records on each outbound call, so it separates
      # openrouter.ai and api.firecrawl.dev from vllm-emb, vllm-rerank, gliner and docling with
      # no extra instrumentation. The aizk dimensions come from the CallerAnnotator span
      # processor in `src/aizk/usage.py`.
      dimensions:
        - aizk.operation
        - aizk.user_id
        - server.address
        - gen_ai.request.model
      # Latency buckets in seconds, reaching far enough right that a slow extraction turn still
      # lands in a real bucket instead of the overflow.
      histogram_buckets: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60]
    service_graphs:
      # Nothing aizk calls is itself traced. vLLM, GLiNER, Docling, ClamAV and every external
      # provider answer without emitting a server span, so an edge only appears if the peer can be
      # named from the client span alone. `peer_attributes` is what does that, and `server.address`
      # is the attribute the httpx instrumentation already sets, which is why the graph covers the
      # whole dependency surface without instrumenting anything else.
      peer_attributes:
        - peer.service
        - server.address
      enable_virtual_node_label: true
    local_blocks:
      flush_to_storage: true
      # This processor keeps only server spans by default, which would drop exactly the spans the
      # token accounting needs, since a model turn is a client span. Turning the filter off is
      # what makes `sum_over_time(span.gen_ai.usage.output_tokens)` answerable per user.
      filter_server_spans: false

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

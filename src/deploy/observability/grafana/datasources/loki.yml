apiVersion: 1

# Provisioning matches an existing datasource by name and then updates it in place, which fails
# when the stored row carries a different uid from the one declared below. A deployment that
# created this datasource before the uid was pinned holds an auto-generated uid such as
# `P44FB859FCA2E8E13`, and from Grafana 13.1.2 that update path answers `Datasource provisioning
# error: data source not found`, aborts the whole datasource pass so the other files never load,
# and crash loops the process rather than degrading. Deleting by name first turns the update into
# a clean insert, so the declared uid always wins. It is idempotent and costs nothing when the
# stored row already matches, and these datasources are `editable: false` and defined entirely
# here, so nothing is lost by recreating them. Dashboards bind to the uid, never to the row id.
deleteDatasources:
  - name: AIZK logs
    orgId: 1

datasources:
  - name: AIZK logs
    type: loki
    uid: aizk-logs
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Loki to Tempo, the half of correlation that makes debugging actually work. Every aizk
      # process logs JSON when AIZK_LOG_JSON is set, and `correlate_trace` in
      # `src/aizk/config/__init__.py` puts the active trace id under `extra`. This regex lifts it
      # back out of the raw line, so a log line that explains a failure carries a button straight
      # to the trace of the request that caused it.
      derivedFields:
        - name: TraceID
          datasourceUid: aizk-traces
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

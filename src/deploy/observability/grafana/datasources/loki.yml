apiVersion: 1

datasources:
  - name: AIZK logs
    type: loki
    uid: aizk-logs
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Loki to Tempo, the half of correlation that makes debugging actually work. Every aizk
      # process logs JSON when AIZK_LOG_JSON is set, and `correlate_trace` in
      # `src/aizk/config/__init__.py` puts the active trace id under `extra`. This regex lifts it
      # back out of the raw line, so a log line that explains a failure carries a button straight
      # to the trace of the request that caused it.
      derivedFields:
        - name: TraceID
          datasourceUid: aizk-traces
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

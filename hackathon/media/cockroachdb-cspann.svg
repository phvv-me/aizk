<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">CockroachDB Cloud C-SPANN evidence</title>
  <desc id="desc">A privacy-safe summary of the live AIZK CockroachDB Cloud cluster and its scoped C-SPANN vector query plan.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#18233f" opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#18233f" flood-opacity=".10"/>
    </filter>
    <style>
      .display { font: 700 58px Georgia, serif; fill: #18233f; }
      .subtitle { font: 400 24px system-ui, sans-serif; fill: #5a6276; }
      .eyebrow { font: 700 16px ui-monospace, monospace; letter-spacing: 3px; fill: #365ff7; }
      .heading { font: 700 25px system-ui, sans-serif; fill: #18233f; }
      .label { font: 700 16px ui-monospace, monospace; fill: #5a6276; letter-spacing: 1px; }
      .value { font: 700 27px system-ui, sans-serif; fill: #18233f; }
      .code { font: 400 21px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #dce5ff; }
      .code-strong { font: 700 21px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #fffaf0; }
      .metric { font: 700 42px Georgia, serif; fill: #18233f; }
      .metric-label { font: 500 16px system-ui, sans-serif; fill: #5a6276; }
    </style>
  </defs>

  <rect width="1800" height="1200" rx="38" fill="#faf6ee"/>
  <rect width="1800" height="1200" rx="38" fill="url(#dots)"/>

  <text class="eyebrow" x="80" y="72">LIVE DATABASE EVIDENCE</text>
  <text class="display" x="80" y="142">Scoped vector search on CockroachDB Cloud</text>
  <text class="subtitle" x="82" y="190">A redacted plan from the AIZK staging database with identifiers and vector values removed</text>

  <g filter="url(#shadow)">
    <rect x="80" y="255" width="1640" height="180" rx="28" fill="#ffffff" stroke="#d8cfbf" stroke-width="3"/>
  </g>
  <text class="label" x="130" y="310">CLUSTER</text>
  <text class="value" x="130" y="356">AIZK</text>
  <text class="label" x="420" y="310">PLAN</text>
  <text class="value" x="420" y="356">Serverless</text>
  <text class="label" x="730" y="310">CLOUD</text>
  <text class="value" x="730" y="356">AWS</text>
  <text class="label" x="980" y="310">REGION</text>
  <text class="value" x="980" y="356">Singapore</text>
  <text class="label" x="1330" y="310">COCKROACHDB</text>
  <text class="value" x="1330" y="356">v26.2.5</text>

  <g filter="url(#shadow)">
    <rect x="80" y="490" width="1030" height="610" rx="28" fill="#10182d"/>
  </g>
  <circle cx="130" cy="538" r="8" fill="#ff6b4a"/>
  <circle cx="158" cy="538" r="8" fill="#f4e8d0" opacity=".65"/>
  <circle cx="186" cy="538" r="8" fill="#8ca7ff" opacity=".75"/>
  <text class="code-strong" x="130" y="604">top-k</text>
  <text class="code" x="170" y="644">order +distance</text>
  <text class="code" x="170" y="684">k 8</text>
  <text class="code-strong" x="170" y="744">lookup join</text>
  <text class="code" x="210" y="784">table scoped_vector@scoped_vector_pkey</text>
  <text class="code-strong" x="210" y="844">vector search</text>
  <text class="code" x="250" y="884">table scoped_vector@ix_scoped_vector_embedding</text>
  <text class="code" x="250" y="924">target count 8</text>
  <text class="code" x="250" y="964">prefix spans kind chunk</text>
  <text class="code" x="250" y="1004">and one exact authorized scope set</text>
  <rect x="130" y="1040" width="898" height="2" fill="#315dff" opacity=".55"/>
  <text class="code" x="130" y="1080">vector and scope values redacted</text>

  <text class="heading" x="1180" y="530">Observed plan</text>

  <rect x="1180" y="580" width="250" height="170" rx="22" fill="#ffffff" stroke="#d8cfbf" stroke-width="3"/>
  <text class="metric" x="1215" y="652">7 ms</text>
  <text class="metric-label" x="1215" y="692">execution time</text>

  <rect x="1470" y="580" width="250" height="170" rx="22" fill="#ffffff" stroke="#d8cfbf" stroke-width="3"/>
  <text class="metric" x="1505" y="652">3.499</text>
  <text class="metric-label" x="1505" y="692">estimated request units</text>

  <rect x="1180" y="790" width="250" height="170" rx="22" fill="#ffffff" stroke="#d8cfbf" stroke-width="3"/>
  <text class="metric" x="1215" y="862">8</text>
  <text class="metric-label" x="1215" y="902">rows decoded from KV</text>

  <rect x="1470" y="790" width="250" height="170" rx="22" fill="#ffffff" stroke="#d8cfbf" stroke-width="3"/>
  <text class="metric" x="1505" y="862">2 ms</text>
  <text class="metric-label" x="1505" y="902">planning time</text>

  <rect x="1180" y="1002" width="540" height="98" rx="22" fill="#dfe7ff"/>
  <text class="heading" x="1450" y="1044" text-anchor="middle">C-SPANN index selected</text>
  <text class="metric-label" x="1450" y="1075" text-anchor="middle">No full vector-table scan</text>
</svg>

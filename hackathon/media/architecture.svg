<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">AIZK deployment architecture</title>
  <desc id="desc">People and agents use authenticated MCP through AWS Lambda. CockroachDB Cloud stores scoped memory and C-SPANN vectors. AWS runs the web app, worker, private file storage, scheduling, images, and logs.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#18233f" opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#18233f" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#365ff7"/>
    </marker>
    <style>
      .display { font: 700 60px Georgia, serif; fill: #18233f; }
      .subtitle { font: 400 25px system-ui, sans-serif; fill: #5a6276; }
      .eyebrow { font: 700 16px ui-monospace, monospace; letter-spacing: 3px; fill: #365ff7; }
      .lane { font: 700 28px system-ui, sans-serif; fill: #18233f; }
      .node { font: 700 24px system-ui, sans-serif; fill: #18233f; }
      .detail { font: 400 18px system-ui, sans-serif; fill: #5a6276; }
      .inverse-node { font: 700 24px system-ui, sans-serif; fill: #fffaf0; }
      .inverse-detail { font: 400 18px system-ui, sans-serif; fill: #dce5ff; }
      .edge { fill: none; stroke: #365ff7; stroke-width: 5; marker-end: url(#arrow); }
      .soft-edge { fill: none; stroke: #8ca7ff; stroke-width: 4; marker-end: url(#arrow); }
      .edge-label { font: 700 16px ui-monospace, monospace; fill: #365ff7; }
    </style>
  </defs>

  <rect width="1800" height="1200" rx="38" fill="#faf6ee"/>
  <rect width="1800" height="1200" rx="38" fill="url(#dots)"/>

  <text class="eyebrow" x="80" y="72">DEPLOYMENT MAP</text>
  <text class="display" x="80" y="142">AIZK on CockroachDB Cloud and AWS</text>
  <text class="subtitle" x="82" y="190">One authenticated MCP origin with durable, scoped memory and private file storage</text>

  <rect x="72" y="260" width="330" height="730" rx="30" fill="#fffaf0" stroke="#d8cfbf" stroke-width="3"/>
  <text class="lane" x="108" y="316">People and identity</text>

  <g filter="url(#shadow)">
    <rect x="108" y="380" width="258" height="142" rx="22" fill="#ffffff" stroke="#18233f" stroke-width="3"/>
    <text class="node" x="237" y="435" text-anchor="middle">People and agents</text>
    <text class="detail" x="237" y="474" text-anchor="middle">Browser or MCP client</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="108" y="620" width="258" height="142" rx="22" fill="#ff6b4a" stroke="#18233f" stroke-width="3"/>
    <text class="node" x="237" y="675" text-anchor="middle">Logto</text>
    <text class="detail" x="237" y="714" text-anchor="middle">Identity and organizations</text>
  </g>

  <text class="detail" x="108" y="870">OAuth with PKCE</text>
  <text class="detail" x="108" y="906">Organization membership</text>
  <text class="detail" x="108" y="942">Scoped permissions</text>

  <rect x="454" y="260" width="830" height="830" rx="30" fill="#f4f7ff" stroke="#365ff7" stroke-width="4"/>
  <text class="lane" x="494" y="316">AWS Singapore</text>

  <g filter="url(#shadow)">
    <rect x="510" y="365" width="718" height="114" rx="22" fill="#afc6ff" stroke="#365ff7" stroke-width="4"/>
    <text class="node" x="869" y="414" text-anchor="middle">Lambda Function URL</text>
    <text class="detail" x="869" y="450" text-anchor="middle">One public origin for the site, app, API, and MCP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="550" width="718" height="128" rx="22" fill="#18233f"/>
    <text class="inverse-node" x="869" y="602" text-anchor="middle">MCP Lambda</text>
    <text class="inverse-detail" x="869" y="641" text-anchor="middle">Authenticate, keep, find, report, and share</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="748" width="334" height="126" rx="22" fill="#ffffff" stroke="#365ff7" stroke-width="3"/>
    <text class="node" x="677" y="799" text-anchor="middle">Web Lambda</text>
    <text class="detail" x="677" y="836" text-anchor="middle">Landing, docs, and dashboard</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="894" y="748" width="334" height="126" rx="22" fill="#ffffff" stroke="#365ff7" stroke-width="3"/>
    <text class="node" x="1061" y="799" text-anchor="middle">Worker Lambda</text>
    <text class="detail" x="1061" y="836" text-anchor="middle">Convert, embed, extract, project</text>
  </g>

  <rect x="510" y="942" width="718" height="96" rx="20" fill="#e8edfb" stroke="#b9c6e8" stroke-width="2"/>
  <text class="node" x="869" y="983" text-anchor="middle">S3 · EventBridge Scheduler · ECR · CloudWatch · SSM · Budgets</text>
  <text class="detail" x="869" y="1015" text-anchor="middle">Private originals, recovery, immutable images, logs, secrets, and cost limits</text>

  <rect x="1336" y="260" width="392" height="550" rx="30" fill="#fffaf0" stroke="#18233f" stroke-width="4"/>
  <text class="lane" x="1374" y="316">CockroachDB Cloud</text>

  <g filter="url(#shadow)">
    <rect x="1382" y="380" width="300" height="146" rx="22" fill="#18233f"/>
    <text class="inverse-node" x="1532" y="433" text-anchor="middle">Persistent memory</text>
    <text class="inverse-detail" x="1532" y="471" text-anchor="middle">Sources, graph, time, and RLS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1382" y="594" width="300" height="146" rx="22" fill="#18233f"/>
    <text class="inverse-node" x="1532" y="647" text-anchor="middle">Scoped C-SPANN</text>
    <text class="inverse-detail" x="1532" y="685" text-anchor="middle">Distributed vector candidates</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1336" y="878" width="392" height="160" rx="30" fill="#ff6b4a" stroke="#18233f" stroke-width="3"/>
    <text class="node" x="1532" y="939" text-anchor="middle">Hosted models</text>
    <text class="detail" x="1532" y="978" text-anchor="middle">Bounded embedding and extraction</text>
  </g>

  <path class="edge" d="M366 451H510"/>
  <text class="edge-label" x="438" y="432" text-anchor="middle">HTTPS</text>

  <path class="edge" d="M366 691H430V614H510"/>
  <text class="edge-label" x="418" y="674" text-anchor="middle">TOKENS</text>

  <path class="edge" d="M869 479V550"/>
  <text class="edge-label" x="890" y="524">ROUTE</text>

  <path class="soft-edge" d="M720 678V748"/>
  <path class="soft-edge" d="M1018 678V748"/>

  <path class="edge" d="M1228 602H1304V453H1382"/>
  <text class="edge-label" x="1298" y="581" text-anchor="middle">SCOPED SQL</text>

  <path class="edge" d="M1228 638H1320V667H1382"/>
  <text class="edge-label" x="1302" y="700" text-anchor="middle">CANDIDATES</text>

  <path class="edge" d="M1061 874V918H1298V958H1336"/>
  <text class="edge-label" x="1262" y="938" text-anchor="end">MODEL CALLS</text>
</svg>

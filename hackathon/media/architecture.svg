<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">crAIZK architecture</title>
  <desc id="desc">People and MCP agents connect through Logto to two AWS Lambda functions. CockroachDB Cloud stores memory and scoped C-SPANN vectors. Amazon S3 stores original files.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#17223b" opacity=".10"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315dff"/>
    </marker>
    <style>
      .title { font: 700 54px system-ui, sans-serif; fill: #17223b; }
      .subtitle { font: 400 25px system-ui, sans-serif; fill: #44506a; }
      .group { font: 700 30px system-ui, sans-serif; fill: #17223b; }
      .node { font: 700 25px system-ui, sans-serif; fill: #17223b; }
      .detail { font: 400 19px system-ui, sans-serif; fill: #44506a; }
      .dark-node { font: 700 25px system-ui, sans-serif; fill: #f4e8d0; }
      .dark-detail { font: 400 19px system-ui, sans-serif; fill: #dbe5ff; }
      .edge { fill: none; stroke: #315dff; stroke-width: 5; marker-end: url(#arrow); }
      .edge-label { font: 600 18px system-ui, sans-serif; fill: #315dff; }
    </style>
  </defs>

  <rect width="1800" height="1200" rx="36" fill="#f4e8d0"/>
  <rect width="1800" height="1200" rx="36" fill="url(#dots)"/>

  <text class="title" x="80" y="94">crAIZK on CockroachDB Cloud and AWS</text>
  <text class="subtitle" x="82" y="142">Durable, scoped agent memory with source evidence and one public MCP origin</text>

  <rect x="450" y="205" width="690" height="900" rx="28" fill="#f7f9ff" stroke="#315dff" stroke-width="6"/>
  <text class="group" x="795" y="255" text-anchor="middle">AWS Singapore</text>

  <rect x="80" y="275" width="290" height="125" rx="18" fill="#f4e8d0" stroke="#17223b" stroke-width="5"/>
  <text class="node" x="225" y="326" text-anchor="middle">People and agents</text>
  <text class="detail" x="225" y="362" text-anchor="middle">Browser or MCP client</text>

  <rect x="80" y="485" width="290" height="125" rx="18" fill="#ff6b4a" stroke="#17223b" stroke-width="5"/>
  <text class="node" x="225" y="536" text-anchor="middle">Logto</text>
  <text class="detail" x="225" y="572" text-anchor="middle">Identity and organizations</text>

  <rect x="80" y="815" width="290" height="125" rx="18" fill="#f4e8d0" stroke="#17223b" stroke-width="5"/>
  <text class="node" x="225" y="866" text-anchor="middle">ccloud CLI</text>
  <text class="detail" x="225" y="902" text-anchor="middle">Cluster and SQL operations</text>

  <rect x="555" y="310" width="480" height="120" rx="18" fill="#a9c5ff" stroke="#315dff" stroke-width="5"/>
  <text class="node" x="795" y="362" text-anchor="middle">Lambda Function URL</text>
  <text class="detail" x="795" y="398" text-anchor="middle">Site, docs, app, API and MCP</text>

  <rect x="555" y="515" width="480" height="135" rx="18" fill="#a9c5ff" stroke="#315dff" stroke-width="5"/>
  <text class="node" x="795" y="567" text-anchor="middle">MCP Lambda</text>
  <text class="detail" x="795" y="603" text-anchor="middle">Authenticate, keep, find and share</text>

  <rect x="555" y="735" width="480" height="135" rx="18" fill="#a9c5ff" stroke="#315dff" stroke-width="5"/>
  <text class="node" x="795" y="787" text-anchor="middle">Worker Lambda</text>
  <text class="detail" x="795" y="823" text-anchor="middle">Convert, embed, extract and project</text>

  <rect x="520" y="950" width="250" height="105" rx="18" fill="#a9c5ff" stroke="#315dff" stroke-width="5"/>
  <text class="node" x="645" y="993" text-anchor="middle">EventBridge</text>
  <text class="detail" x="645" y="1026" text-anchor="middle">Queue recovery</text>

  <path d="M895 950 h120 q35 0 35 35 v35 q0 35 -35 35 h-120 q-35 0 -35 -35 v-35 q0 -35 35 -35z" fill="#a9c5ff" stroke="#315dff" stroke-width="5"/>
  <text class="node" x="955" y="993" text-anchor="middle">Amazon S3</text>
  <text class="detail" x="955" y="1026" text-anchor="middle">Private originals</text>

  <rect x="1215" y="240" width="505" height="610" rx="28" fill="#f4e8d0" stroke="#17223b" stroke-width="6"/>
  <text class="group" x="1468" y="292" text-anchor="middle">CockroachDB Cloud</text>

  <rect x="1280" y="345" width="375" height="190" rx="18" fill="#17223b"/>
  <text class="dark-node" x="1468" y="402" text-anchor="middle">Persistent memory</text>
  <text class="dark-detail" x="1468" y="443" text-anchor="middle">Sources, scopes, graph and time</text>
  <text class="dark-detail" x="1468" y="477" text-anchor="middle">Usage and durable queue</text>

  <rect x="1280" y="620" width="375" height="145" rx="18" fill="#17223b"/>
  <text class="dark-node" x="1468" y="678" text-anchor="middle">Scoped C-SPANN</text>
  <text class="dark-detail" x="1468" y="719" text-anchor="middle">Distributed vector candidates</text>

  <rect x="1215" y="930" width="505" height="125" rx="18" fill="#ff6b4a" stroke="#17223b" stroke-width="5"/>
  <text class="node" x="1468" y="981" text-anchor="middle">Hosted models</text>
  <text class="detail" x="1468" y="1017" text-anchor="middle">Bounded embedding and extraction</text>

  <path class="edge" d="M370 337 H555"/>
  <text class="edge-label" x="462" y="320" text-anchor="middle">HTTPS and PKCE</text>

  <path class="edge" d="M370 548 H445 V370 H555"/>
  <text class="edge-label" x="420" y="524" text-anchor="middle">token authority</text>

  <path class="edge" d="M795 430 V515"/>
  <text class="edge-label" x="820" y="480">authenticated MCP</text>

  <path class="edge" d="M795 650 V735"/>
  <text class="edge-label" x="820" y="701">bounded wake</text>

  <path class="edge" d="M1035 565 H1170 V440 H1280"/>
  <text class="edge-label" x="1125" y="546">authorized recall</text>

  <path class="edge" d="M1035 610 H1185 V692 H1280"/>
  <text class="edge-label" x="1130" y="665">vector candidates</text>

  <path class="edge" d="M1035 790 H1160 V490 H1280"/>
  <text class="edge-label" x="1115" y="818">durable enrichment</text>

  <path class="edge" d="M645 950 V905 H740 V870"/>
  <text class="edge-label" x="645" y="925" text-anchor="middle">recover</text>

  <path class="edge" d="M885 870 V950"/>
  <text class="edge-label" x="910" y="920">originals</text>

  <path class="edge" d="M1035 835 H1165 V993 H1215"/>
  <text class="edge-label" x="1130" y="970">model calls</text>

  <path class="edge" d="M370 878 H1145 V390 H1280"/>
  <text class="edge-label" x="520" y="860">managed operations</text>
</svg>

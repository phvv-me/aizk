<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">AIZK database steward live staging verdict</title>
  <desc id="desc">A redacted healthy verdict from one agent invocation using CockroachDB Managed MCP, SHOW JOBS, and CockroachDB Agent Skills.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070712"/>
      <stop offset="0.55" stop-color="#111027"/>
      <stop offset="1" stop-color="#09172c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c7cff"/>
      <stop offset="0.58" stop-color="#6547dc"/>
      <stop offset="1" stop-color="#218bd1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7656ed"/>
      <stop offset="1" stop-color="#20c99a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1800" height="1200" fill="url(#background)"/>
  <circle cx="1510" cy="140" r="210" fill="#4937bb" opacity="0.12" filter="url(#glow)"/>
  <circle cx="180" cy="1100" r="260" fill="#1769a4" opacity="0.14" filter="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="112" y="91" width="68" height="68" rx="18" fill="url(#mark)" transform="rotate(-5 146 125)"/>
    <text x="146" y="136" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">AI</text>
    <text x="201" y="130" font-size="38" font-weight="750" fill="#fff">AIZK database steward</text>
    <text x="201" y="168" font-size="20" fill="#a99df4">One live staging agent with CockroachDB evidence</text>

    <circle cx="1528" cy="132" r="7" fill="#4ce6a4"/>
    <text x="1548" y="140" font-size="20" font-weight="700" fill="#b8ffdf">Staging healthy</text>

    <rect x="112" y="225" width="1576" height="744" rx="30" fill="#090a17" stroke="#332d58" stroke-width="2"/>
    <rect x="112" y="225" width="1576" height="66" rx="30" fill="#0f1020"/>
    <path d="M112 261v30h1576v-30" fill="#0f1020"/>
    <circle cx="144" cy="258" r="7" fill="#ff6e78"/>
    <circle cx="168" cy="258" r="7" fill="#ffc560"/>
    <circle cx="192" cy="258" r="7" fill="#63daa0"/>
    <text x="900" y="264" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#918ab2">redacted live verdict</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">
      <text x="155" y="347" fill="#785cff">$</text>
      <text x="180" y="347" fill="#f7f5ff">uv run --no-sync python hackathon/operator/steward.py diagnose</text>

      <text x="155" y="405" fill="#918ab2">severity</text>
      <text x="470" y="405" font-weight="700" fill="#4ce6a4">healthy</text>
      <text x="155" y="446" fill="#918ab2">queue failures</text>
      <text x="470" y="446" fill="#f7f5ff">0</text>
      <text x="155" y="487" fill="#918ab2">CockroachDB job failures</text>
      <text x="470" y="487" font-weight="700" fill="#4ce6a4">0</text>
      <text x="155" y="528" fill="#918ab2">effective action</text>
      <text x="470" y="528" font-weight="700" fill="#4ce6a4">no_action</text>
      <text x="155" y="569" fill="#918ab2">MCP tools</text>
      <text x="470" y="569" fill="#f7f5ff">get_cluster · select_query</text>
      <text x="155" y="610" fill="#918ab2">SQL privilege</text>
      <text x="470" y="610" fill="#f7f5ff">VIEWJOB</text>
      <text x="155" y="651" fill="#918ab2">SQL statement</text>
      <text x="470" y="651" fill="#f7f5ff">SHOW JOBS</text>
      <text x="155" y="692" fill="#918ab2">Agent Skills</text>
      <text x="470" y="692" fill="#f7f5ff">cluster health · background jobs · AIZK queue recovery</text>

      <rect x="155" y="727" width="1490" height="2" fill="url(#rule)" opacity="0.3"/>
      <text x="155" y="778" fill="#4ce6a4">✓</text>
      <text x="182" y="778" fill="#d9d5ef">Cluster state is CREATED on the BASIC plan</text>
      <text x="155" y="818" fill="#4ce6a4">✓</text>
      <text x="182" y="818" fill="#d9d5ef">Current queue has 0 failed, 0 picked, and 0 queued tasks</text>
      <text x="155" y="858" fill="#4ce6a4">✓</text>
      <text x="182" y="858" fill="#d9d5ef">Background jobs have 0 failed, 0 paused, and 0 unusually long runs</text>
      <text x="155" y="898" fill="#4ce6a4">✓</text>
      <text x="182" y="898" fill="#d9d5ef">One typed DeepSeek assessment recommended no action</text>
    </g>

    <text x="112" y="1026" font-size="18" fill="#918ab2">One invocation · fixed read-only collection · one typed model assessment</text>
    <text x="1688" y="1026" text-anchor="end" font-size="18" font-weight="700" fill="#b9aaff">The model receives no database tools</text>
    <text x="112" y="1082" font-size="16" fill="#67617e">No credential, cluster identifier, database name, organization data, source text, queue payload, or stored error is shown.</text>
  </g>
</svg>

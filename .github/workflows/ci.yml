name: CI

# Python dependencies live in pyproject.toml and their exact resolutions live in uv.lock. The one
# unreleased SQLAlchemy API is fixed to a reviewed commit in scripts/install-sqlalchemy.sh.
on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm --dir src/web install --frozen-lockfile
      - run: pnpm --dir src/web check
      - run: pnpm --dir src/web lint
      - run: pnpm --dir src/web test
      - run: pnpm --dir src/web build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Install the reviewed SQLAlchemy row security revision
        run: sh scripts/install-sqlalchemy.sh
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync lint-imports
      - run: |
          uv run --no-sync pyrefly check
          uv run --no-sync ty check --python .venv --exit-zero-on-warning
          uv run --no-sync mypy src/aizk src/eval
      - run: |
          CDK_OUTDIR=cdk.out uv run --no-sync python -m infra.aws.app
          uv run --no-sync python -m pytest tests/deploy --no-cov

  # The suite is hermetic above the database seam (every model endpoint is faked), but the
  # database itself is real: the same VectorChord image the compose file ships, on the same host
  # port, with the same restricted app role initdb/roles.sh creates, so forced row level security
  # is exercised exactly as in production. macOS carries no service containers, so tests are a
  # Linux job; cross-platform parity is a v1 roadmap item.
  test:
    runs-on: ubuntu-latest
    # the suite builds its DSNs from these; in production they come from .env, which CI has no
    # copy of, so pass the service-container admin password and the bootstrapped app-role password
    env:
      AIZK_ADMIN_PASSWORD: aizk
      AIZK_APP_PASSWORD: aizk_app
    services:
      db:
        image: tensorchord/vchord-suite:pg18-latest
        env:
          POSTGRES_USER: aizk_admin
          POSTGRES_PASSWORD: aizk
          POSTGRES_DB: aizk
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aizk_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Install the reviewed SQLAlchemy row security revision
        run: sh scripts/install-sqlalchemy.sh
      # the role bootstrap initdb/roles.sh performs against a compose volume; a service container
      # cannot mount repo files, so the same statements run here over the wire
      - name: bootstrap app role
        run: |
          PGPASSWORD=aizk psql -h localhost -p 5433 -U aizk_admin -d aizk -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE aizk_app LOGIN PASSWORD 'aizk_app' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT USAGE ON SCHEMA public TO aizk_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO aizk_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO aizk_app;
          SQL
      # The default sysmon coverage core cannot emit one async-with enter arc in the graph build
      # retry loop. That test runs once more under pytrace before the 100 percent gate is enforced.
      - run: uv run --no-sync python -m pytest -n 4 --dist loadscope --benchmark-disable --cov-fail-under=0
      - run: >-
          COVERAGE_CORE=pytrace uv run --no-sync python -m pytest
          tests/graph/test_build.py::test_write_graph_slice_retries_a_transient_db_conflict
          -o addopts=--import-mode=importlib
          --cov=aizk --cov-append --cov-report=term-missing

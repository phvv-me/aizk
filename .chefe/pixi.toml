[workspace]
name = "aizk"
version = "0.0.1"
channels = ["conda-forge"]
platforms = ["linux-64"]

[activation]
scripts = ["dotenv.sh"]

[dependencies]
python = ">=3.14.6,<3.15"
nodejs = ">=24,<25"

[pypi-dependencies]
sqlalchemy-cockroachdb = "<2.1,>=2.0.4"
greenlet = "<4,>=3"
sqlmodel = "<0.1,>=0.0.39"
asyncpg = "<0.32,>=0.31"
alembic = "<2,>=1.18.5"
pgvector = "<0.6,>=0.5"
pydantic-settings = "<3,>=2.14.2"
httpx = "<0.29,>=0.28.1"
async-lru = "<3,>=2.3"
clamav-client = "<0.8,>=0.7.2"
cyclopts = "<5,>=4.21"
loguru = "<0.8,>=0.7.3"
fastmcp = "==4.0.0b2"
fastapi = "<1,>=0.128"
networkx = "<4,>=3.6.1"
openai = "<3,>=2.45"
obstore = "<0.12,>=0.11"
chonkie = "<2,>=1.7"
identify = "<3,>=2.6.19"
python-slugify = "<9,>=8.0.4"
inflection = "<0.6,>=0.5.1"
mainboard = ">=0.0.9"
pgqueuer = "<2,>=1.1.1"
croniter = "<7,>=6.2.4"
pendulum = "<4,>=3.2"
mangum = "<1,>=0.19"
boto3 = "<2,>=1.40"
opentelemetry-sdk = "<2,>=1.44"
opentelemetry-exporter-otlp-proto-http = "<2,>=1.43"
opentelemetry-instrumentation-starlette = "<1,>=0.65b0"
opentelemetry-instrumentation-sqlalchemy = "<1,>=0.65b0"
opentelemetry-instrumentation-httpx = "<1,>=0.65b0"
dateparser = "<2,>=1.4.1"
jinja2 = "<4,>=3.1.6"
tenacity = "<10,>=9.1.4"
liteparse = "<3,>=2.11.1"
pypandoc-binary = "<2,>=1.17"

[pypi-dependencies.sqlalchemy]
git = "https://github.com/Pedrexus/sqlalchemy.git"
rev = "1bbe0d64d6017b346a5e6f7bf784ba7a3294662f"
extras = ["asyncio"]

[pypi-dependencies.py-key-value-aio]
version = "<0.5,>=0.4.5"
extras = ["keyring", "s3"]

[pypi-dependencies.pydantic-ai-slim]
version = "<3,>=2.8"
extras = ["openai"]

[pypi-dependencies.patos]
version = "==0.0.12"
extras = ["sql"]

[pypi-dependencies.rlsalchemy]
git = "https://github.com/phvv-me/rls.git"
rev = "16a7798ffcae819a8bf3e7114344e9e99c1be8f6"

[pypi-dependencies.aizk]
path = "../."
editable = true

[pypi-options]
prerelease-mode = "allow"

[pypi-options.dependency-overrides.sqlalchemy]
git = "https://github.com/Pedrexus/sqlalchemy.git"
rev = "1bbe0d64d6017b346a5e6f7bf784ba7a3294662f"

[feature.dev.pypi-dependencies]
fire = "<0.8,>=0.7.1"
pydantic-evals = "<3,>=2.8"
ir-measures = "<0.5,>=0.4.3"
pytrec-eval-terrier = "<0.6,>=0.5.10"
autorank = "<2,>=1.3.0"
statsmodels = "<0.15,>=0.14.6"
pytest-regressions = "<3,>=2.11.0"
modal = "<2,>=1.5.2"
numpy = "<3,>=2.4.6"
pandas = "<4,>=3.0.3"
pillow = "<13,>=12"
asyncpg-stubs = "<0.32,>=0.31.2"
types-dateparser = "<2,>=1.4.1.20260617"
types-croniter = "<7,>=6.2.2.20260518"
types-networkx = "<4,>=3.6.1.20260624"
aws-cdk-lib = "<3,>=2.200"
constructs = "<11,>=10.4"
ruff = ">=0.6"
pyrefly = "<2,>=1.1.1"
ty = "<0.1,>=0.0.61"
mypy = "<3,>=2.3.0"
import-linter = "<3,>=2.3"
pytest = "<10,>=9.1.0"
pytest-cov = "<8,>=7.1.0"
pytest-randomly = "<5,>=4.1.0"
pytest-xdist = "<4,>=3.8.0"
pytest-mock = "<4,>=3.15.1"
pytest-subprocess = "<2,>=1.6.0"
pytest-benchmark = "<6,>=5.2.3"
pytest-clarity = "<2,>=1.0.1"
pytest-rerunfailures = "<17,>=16.3"
pytest-timeout = "<3,>=2.4.0"
hypothesis = "<7,>=6.155.3"
polyfactory = "<4,>=3.3"
faker = "<41,>=40.23.0"
syrupy = "<6,>=5.3.2"
dirty-equals = "<0.12,>=0.11"

[feature.dev.pypi-dependencies.boto3-stubs]
version = "<2,>=1.40"
extras = ["lambda"]

[environments.default]
features = ["dev"]

[tasks.lint]
cmd = "ruff check . && ruff format --check ."
cwd = ".."

[tasks.lint-imports]
cmd = "lint-imports"
cwd = ".."

[tasks.typecheck]
cmd = "pyrefly check --python-interpreter-path \"$CONDA_PREFIX/bin/python\" && ty check --python \"$CONDA_PREFIX\" --exit-zero-on-warning && mypy src/aizk src/eval"
cwd = ".."

[tasks.test]
cmd = "python -m pytest -n 4 --dist loadscope --benchmark-disable --cov-fail-under=0 && COVERAGE_CORE=pytrace python -m pytest 'tests/graph/test_build.py::test_write_graph_slice_retries_a_transient_db_conflict' -o addopts='--import-mode=importlib' --cov=aizk --cov-append --cov-report=term-missing"
cwd = ".."

[tasks.infra-synth]
cmd = "python -m infra.aws.app"
cwd = ".."

[tasks.infra-synth.env]
CDK_OUTDIR = "cdk.out"

[tasks.infra-test]
cmd = "python -m pytest tests/deploy --no-cov"
cwd = ".."

[tasks.infra-check]
depends-on = ["infra-synth", "infra-test"]

[tasks.infra-bootstrap]
cmd = "cdk bootstrap --app 'python -m infra.aws.app'"
cwd = ".."

[tasks.infra-deploy]
cmd = "cdk deploy --app 'python -m infra.aws.app'"
cwd = ".."

[tasks.ccloud-build]
cmd = "docker compose -f src/deploy/cockroachdb/docker-compose.ccloud.yml build ccloud"
cwd = ".."

[tasks.ccloud]
cmd = "sh -lc 'docker compose -f src/deploy/cockroachdb/docker-compose.ccloud.yml run --rm ccloud \"$@\"' --"
cwd = ".."

[tasks.ccloud-check]
cmd = "docker compose -f src/deploy/cockroachdb/docker-compose.ccloud.yml run --rm ccloud version && docker run --rm --entrypoint cockroach-sql aizk-cockroachdb-ccloud:0.6.12 --version"
depends-on = ["ccloud-build"]
cwd = ".."
